# Run PyTorch GPU validation (Conv1d + Conv3d), plus minimal ROCm sanity.
run:
  profile: pytorch
  ask_before_downloads: true
  downloads_enabled: true

workloads:
  pytorch:
    auto_install: true
    # Best-effort default for ROCm PyTorch wheels (adjust if needed).
    pip_args: ["--index-url", "https://download.pytorch.org/whl/rocm6.2"]
    packages: ["torch"]
    expected_version_substr: "+rocm6.2"
    # ROCm wheels are often coupled to a specific ROCm runtime; prefer the system
    # ROCm runtime for this check unless you have a matching in-tree build.
    use_in_tree_rocm: false

steps:
  rocm_sanity: true
  rocm_bench_smoke: false
  miopen_smoke: false
  llama_cpp_docker: false
  ollama: false
  open_interpreter: false
  whisper: false
  mfem_hip: false
  pytorch: true
  petsc_hip: false
