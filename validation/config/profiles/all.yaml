# All validations/workloads:
# - Runs in-tree ROCm sanity + benches
# - Runs all third-party workloads (downloads/builds gated by one Y/n prompt; use --yes)
# - Enables optional heavy validations (PyTorch, PETSc)
run:
  profile: all
  ask_before_downloads: true
  downloads_enabled: true

workloads:
  pytorch:
    # Default: build a ROCm 7.11-aligned torch wheel from source (heavy).
    # This avoids accidental CPU fallback due to mismatched ROCm wheel channels.
    auto_install: true
    expected_hip_substr: "7.11"
    require_rocm_prefix: "in-tree"
    source_build:
      enabled: true
      backend: "in-tree"
  whisper:
    auto_install: true
    packages: ["openai-whisper"]
    use_in_tree_rocm: true
    # Heavier than the default tiny model to make GPU usage more visible.
    model: "base"
    beam_size: 5
    best_of: 5
    # The bundled audio sample is very short; repeat it to reach a longer
    # duration for a clearer sustained GPU signal.
    audio_target_s: 300

timeouts_s:
  # Whisper can take significantly longer with longer audio + larger model.
  whisper: 7200

steps:
  rocm_sanity: true
  rocm_bench_smoke: true
  miopen_smoke: true
  llama_cpp_docker: true
  ollama: true
  open_interpreter: true
  whisper: true
  mfem_hip: true
  pytorch: true
  petsc_hip: true
