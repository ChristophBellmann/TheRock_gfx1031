# Default config: "everything enabled" (heavy steps will download/build after one Y/n prompt).
run:
  profile: quick
  ask_before_downloads: true
  downloads_enabled: true
  power_monitor: true       # default: show power/energy (Ws) in terminal
  summary_multiline: false  # default: one line per test
  all_build_dirs: false     # default: only validate the preferred build dir
  max_download_gb: 8
  max_single_download_gb: 4
  build_dirs: []           # empty => auto-detect (build-stage2/build/build-stage1)

rocm:
  amd_gpu_arch: gfx1031
  prefer_in_tree_rocm: true

workloads:
  pytorch:
    # PyTorch ROCm wheels are large and version/index dependent. By default we
    # do not auto-install. If you already have ROCm torch in the validation venv,
    # the steps run and enforce GPU usage via power/gpu%.
    auto_install: false
    # Optional pip flags and package list for auto-install:
    # pip_args: ["--index-url", "https://download.pytorch.org/whl/rocm6.2"]
    # packages: ["torch", "torchvision"]
    min_bench_s: 5.0
  llama_cpp:
    docker_image: ""   # optional override; empty => auto-detect from AMD docs
    prompt_file: "validation/src/assets/samples/prompts/tiny_prompt.txt"
    num_predict: 512
    min_bench_s: 5.0
    # Optional functional test (disabled unless you provide a model):
    model_url: "https://huggingface.co/bartowski/Llama-3.2-3B-Instruct-GGUF/resolve/main/Llama-3.2-3B-Instruct-Q4_K_M.gguf"
    # Filled after first download for reproducibility:
    model_sha256: "6c1a2b41161032677be168d354123594c0e6e67d2b9227c84f296ad037c728ff"
    model_file: "validation/workspace/cache/downloads/llama_cpp/Llama-3.2-3B-Instruct-Q4_K_M.gguf"
    # docker_cmd: ["llama-cli", "-m", "/model.gguf", "-p", "hello", "-n", "32"]  # optional override
  ollama:
    url: "https://ollama.com/download/ollama-linux-amd64.tgz"
    prompt_file: "validation/src/assets/samples/prompts/tiny_prompt.txt"
    # Optional functional test (disabled unless set):
    # model: "tinyllama"
    model: "llama3.2:3b-instruct-q4_0"  # enables `ollama pull` + `ollama run` smoke (≈1.9GB model)
    num_predict: 512
    min_bench_s: 5.0
    use_docker: "auto"     # auto|true|false; auto prefers docker ROCm when host binary lacks ROCm backend
    docker_image: "ollama/ollama:rocm"
  mfem:
    git: "https://github.com/mfem/mfem.git"
    ref: "master"
    # Prefer a complex 3D mesh for a clearer sustained GPU signal.
    mesh: "fichera.mesh"
    # Parameters for the MFEM HIP micro-benchmark (repeated operator apply).
    order: 3
    # -1 means "auto refine" similar to MFEM ex1: refine up to ~50k elements.
    refine: -1
    pa: 1
    min_bench_s: 5.0
  whisper:
    # Optional auto-install (requires downloads enabled). Whisper needs a ROCm-enabled
    # PyTorch in the validation venv.
    auto_install: false
    pip_args: []
    packages: ["openai-whisper"]
    audio_file: "validation/src/assets/samples/audio/Take2_Audio1-1.wav"
    # Optional: generate a longer WAV by repeating the bundled sample to reach
    # the target duration (seconds). This increases sustained GPU work on short
    # samples. 0 disables (default).
    audio_target_s: 0
    # Keep defaults small, but use beam search to increase compute and produce
    # a clearer GPU signal than greedy decode for very short audio.
    model: "tiny.en"
    beam_size: 5
    best_of: 5
    min_bench_s: 5.0
  petsc:
    git: "https://gitlab.com/petsc/petsc.git"
    ref: "release"
    min_bench_s: 5.0

steps:
  rocm_sanity: true
  rocm_bench_smoke: true
  miopen_smoke: true
  llama_cpp_docker: true
  ollama: true
  open_interpreter: true
  whisper: true
  mfem_hip: true
  pytorch: false
  petsc_hip: false

timeouts_s:
  rocminfo: 10
  hipcc_compile_run: 120
  rocblas_bench: 60
  rocfft_bench: 30
  rocrand_bench: 30
  miopen_driver: 10
  miopen_smoke: 240
  llama_cpp_docker: 900
  llama_cpp_infer: 600
  ollama: 120
  ollama_pull: 1800
  ollama_run: 600
  open_interpreter: 900
  whisper: 1800
  mfem_hip: 3600
  pytorch: 900
  pytorch_install: 1800
  petsc_configure: 3600
  petsc_build: 7200
